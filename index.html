<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Manager Money Pro</title>
    
    <meta name="theme-color" content="#050810">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg: #050810;
            --glass: rgba(15, 23, 42, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-dim: #64748b;
            --income: #10b981;
            --expense: #f43f5e;
            --fixed: #8b5cf6;
            --accent: #0ea5e9;
            --title-grad: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Heebo', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; padding: 0;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            /* הבטחת רקע מלא גם כשהדף קצר */
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, #050810 100%) no-repeat fixed;
            overflow-x: hidden;
            padding: 10px;
        }

        /* מכולה ראשית שמוודאת שהתוכן לא "בורח" */
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            padding-bottom: 140px; 
            min-height: calc(100vh - 20px);
        }

        header { padding: 30px 0 20px; text-align: center; }
        .brand h1 { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; }
        .brand h1 span { color: #38bdf8; }

        .header-tools { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; }
        .status-pill { 
            background: rgba(255,255,255,0.05); 
            padding: 5px 15px; 
            border-radius: 20px; 
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--expense); }
        .dot.online { background: var(--income); box-shadow: 0 0 10px var(--income); }

        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass); padding: 10px 20px; border-radius: 15px;
            border: 1px solid var(--glass-border); margin: 20px auto; width: 100%; max-width: 260px;
        }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 1.5rem; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stat-card { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            padding: 20px; 
            border-radius: 20px; 
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .stat-card label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 5px; }
        .stat-card b { font-size: 1.4rem; display: block; }

        .item { 
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px; 
            padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85px;
            background: rgba(5, 8, 16, 0.9); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; backdrop-filter: blur(20px);
            padding-bottom: env(safe-area-inset-bottom); /* תמיכה באייפונים ונוטץ' */
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); text-decoration: none; font-size: 0.7rem; }
        .nav-link.active { color: var(--accent); }
        .nav-link i { font-size: 1.5rem; margin-bottom: 5px; }

        .fab { 
            position: fixed; bottom: 100px; left: 25px; width: 60px; height: 60px; 
            background: var(--title-grad); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; color: #fff; border: none; z-index: 1100;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
        }

        .login-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, #050810 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div style="font-size: 5rem; margin-bottom: 20px;">💎</div>
    <div class="brand"><h1>Manager<span>Money</span></h1></div>
    <button class="btn-main" onclick="loginGoogle()" style="margin-top: 40px; width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 900; background: white; color: black; cursor: pointer;">התחבר עם Google</button>
</div>

<div class="container">
    <header>
        <div class="brand"><h1>Manager<span>Money</span></h1></div>
        <div class="header-tools">
            <div class="status-pill">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">מתחבר...</span>
            </div>
            <span id="eyeBtn" style="font-size: 1.3rem; cursor: pointer;">👁️</span>
        </div>
    </header>

    <div class="top-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">▸</button>
        <b id="monthLabel">אפריל 2026</b>
        <button class="nav-btn" onclick="changeMonth(1)">◂</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <label>יתרה נוכחית</label>
            <b id="bCurrent">₪0</b>
        </div>
        <div class="stat-card">
            <label>לאחר קבועות</label>
            <b id="bTotal">₪0</b>
        </div>
    </div>

    <div id="mainList" style="text-align: center; color: var(--text-dim); margin-top: 40px;">
        אין נתונים
    </div>

    <div style="text-align: center; font-size: 0.7rem; color: var(--text-dim); margin-top: 50px; letter-spacing: 1px;">
        ALEXANDER-ZAVODISKER 2026 ©
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-link active"><i>🏠</i>בית</div>
    <div class="nav-link"><i>📊</i>גרפים</div>
    <div class="nav-link"><i>📈</i>סיכום</div>
</nav>

<button class="fab">+</button>

<script>
    // הגדרות Firebase שלך
    const firebaseConfig = {
        apiKey: "AIzaSyAZ2-EJjvIbDvtKLwKg3LObkIAs8sNhyjU",
        authDomain: "managermoney-49d0e.firebaseapp.com",
        projectId: "managermoney-49d0e",
        databaseURL: "https://managermoney-49d0e-default-rtdb.europe-west1.firebasedatabase.app",
    };
    firebase.initializeApp(firebaseConfig);

    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider);
    }

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('statusDot').classList.add('online');
            document.getElementById('statusText').innerText = 'מחובר';
            // כאן תוכל להוסיף טעינת נתונים מה-Database
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    });

    function changeMonth(n) {
        // לוגיקה לשינוי חודש
    }
</script>

</body>
</html>
